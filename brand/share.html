<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Share image</title>
<style>
  /* 1200×630: the hero, held still. Rendered to public/og-image.jpg by share.mjs. */
  @font-face { font-family: "Manrope"; src: url("../public/fonts/Manrope.woff2") format("woff2"); font-weight: 400 800; }
  @font-face { font-family: "DM Sans"; src: url("../public/fonts/DMSans.woff2") format("woff2"); font-weight: 400 600; }
  @font-face { font-family: "Newsreader"; src: url("../public/fonts/Newsreader-italic.woff2") format("woff2"); font-style: italic; font-weight: 300 600; }
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #f6f3ed; color: #1b150d; font-family: "DM Sans", sans-serif; position: relative; }
  .line { position: absolute; inset: 0; width: 100%; height: 100%; }
  .line path { fill: none; stroke: rgb(27 21 13 / 11%); stroke-width: 1.25; vector-effect: non-scaling-stroke; stroke-linecap: round; }
  .head { position: absolute; top: 52px; left: 72px; right: 72px; display: flex; justify-content: space-between; align-items: flex-start; }
  .who { display: flex; gap: 16px; align-items: center; }
  .who em { display: block; font: italic 400 16px/1 Newsreader, serif; color: #675f55; margin-bottom: 4px; }
  .who strong { display: block; font: 600 22px/1 Manrope, sans-serif; letter-spacing: -0.01em; }
  .who strong span { font-weight: 400; color: #675f55; }
  .role { text-align: right; font-size: 15px; line-height: 1.5; color: #675f55; }
  .role b { display: block; font-weight: 500; color: #1b150d; }
  .copy { position: absolute; left: 72px; top: 214px; z-index: 3; }
  .lead { display: block; font: italic 400 54px/1 Newsreader, serif; color: #3c6669; margin: 0 0 6px 4px; }
  .goal { display: block; font: 700 120px/0.92 Manrope, sans-serif; letter-spacing: -0.045em; text-transform: uppercase; margin-left: -6px; }
  .goal i { font-style: normal; color: #b09367; }
  .sentence { margin: 26px 0 0 4px; max-width: 520px; font-size: 22px; line-height: 1.4; color: #1b150d; }
  .disc { position: absolute; z-index: 1; width: 640px; height: 640px; border-radius: 50%; right: -130px; bottom: -250px; background: #ded2bf; }
  .who-img { position: absolute; z-index: 2; right: 96px; bottom: -70px; width: 350px; }
  .who-img img { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
  <svg class="line" viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-hidden="true">
    <path d="M -20 820 C 90 805 140 760 200 745 C 265 728 290 770 330 720 C 375 665 395 610 440 590 C 490 570 505 630 545 595 C 600 545 615 470 670 445 C 720 422 740 470 785 425 C 835 375 860 300 915 268 C 950 248 980 235 1020 220" />

  <header class="head">

    </div>

  <div class="copy">
    <span class="lead">A plan for your</span>

  <figure class="who-img" style="margin:0"><img src="../src/assets/darshan-cutout-812.webp" alt="" /></figure>
